
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta name="theme-color" content="#0756b7">

  <title>Transferencia bancaria | Círculo Dental</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================
       VARIABLES
    ========================================= */

    :root {
      --azul: #0756b7;
      --azul-oscuro: #07377d;
      --naranja: #ff7900;
      --blanco: #ffffff;
      --texto: #182943;
      --borde: #e5eaf2;
    }

    /* =========================================
       ESTILOS GENERALES
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      padding: 150px 20px 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: 'DM Sans', sans-serif;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255, 184, 67, 0.65),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(0, 62, 157, 0.60),
          transparent 42%
        ),
        linear-gradient(
          135deg,
          #ff8a17 0%,
          #ffb05c 34%,
          #1d72d3 72%,
          #063b88 100%
        );
    }

    /* =========================================
       TARJETA PRINCIPAL
    ========================================= */

    .tarjeta {
      position: relative;

      width: 100%;
      max-width: 450px;

      padding: 145px 32px 42px;

      background: rgba(255, 255, 255, 0.98);

      border: 1px solid rgba(255, 255, 255, 0.90);
      border-radius: 30px;

      box-shadow:
        0 30px 80px rgba(5, 36, 83, 0.22),
        0 5px 20px rgba(5, 36, 83, 0.08);
    }

    /* =========================================
       LOGOTIPO GRANDE
    ========================================= */

    .logo {
      position: absolute;

      top: -115px;
      left: 50%;
      transform: translateX(-50%);

      width: 230px;
      height: 230px;

      padding: 12px;

      background: #ffffff;

      border: 6px solid #ffffff;
      border-radius: 32px;

      box-shadow:
        0 15px 35px rgba(4, 39, 93, 0.20);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .logo img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    /* =========================================
       TÍTULO
    ========================================= */

    h1 {
      font-family: 'Outfit', sans-serif;

      font-size: clamp(24px, 5vw, 30px);
      font-weight: 700;

      letter-spacing: -0.7px;
      line-height: 1.2;

      color: var(--azul-oscuro);

      text-align: center;

      margin-bottom: 38px;
    }

    /* =========================================
       CAMPOS BANCARIOS
    ========================================= */

    .campo {
      margin-bottom: 25px;
    }

    .campo:last-child {
      margin-bottom: 0;
    }

    .etiqueta {
      display: block;

      color: var(--texto);

      font-size: 14px;
      font-weight: 700;

      margin-bottom: 12px;
    }

    .dato-contenedor {
      display: flex;
      align-items: center;

      gap: 10px;

      padding: 9px 9px 9px 16px;

      background: #f5f8fd;

      border: 1px solid var(--borde);
      border-radius: 16px;

      transition:
        border-color 0.2s,
        background 0.2s;
    }

    .dato-contenedor:focus-within {
      border-color: var(--azul);
      background: #ffffff;
    }

    .numero {
      flex: 1;
      min-width: 0;

      color: var(--azul-oscuro);

      font-size: clamp(12px, 3.5vw, 16px);
      font-weight: 700;

      letter-spacing: 0.3px;

      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;

      user-select: all;
      -webkit-user-select: all;
    }

    /* =========================================
       BOTÓN COPIAR
    ========================================= */

    .copiar {
      flex-shrink: 0;

      min-width: 90px;

      padding: 13px 14px;

      border: none;
      border-radius: 11px;

      background: var(--azul);
      color: var(--blanco);

      font-family: inherit;
      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      transition:
        background 0.2s,
        transform 0.2s;
    }

    .copiar:hover {
      background: var(--azul-oscuro);
      transform: translateY(-1px);
    }

    .copiar:active {
      transform: scale(0.97);
    }

    .copiar.copiado {
      background: var(--naranja);
    }

    .copiar svg {
      width: 16px;
      height: 16px;

      fill: none;
      stroke: currentColor;

      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================================
       LÍNEA DIVISORIA
    ========================================= */

    .linea {
      height: 1px;

      background: var(--borde);

      margin: 28px 0;
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 480px) {

      body {
        padding: 135px 16px 35px;
      }

      .tarjeta {
        padding: 135px 20px 32px;

        border-radius: 25px;
      }

      .logo {
        width: 210px;
        height: 210px;

        top: -105px;

        border-radius: 28px;
      }

      h1 {
        font-size: 25px;
        margin-bottom: 32px;
      }

      .dato-contenedor {
        padding-left: 12px;
      }

      .copiar {
        min-width: 82px;
        padding: 12px 10px;
      }
    }

    @media (max-width: 360px) {

      .tarjeta {
        padding-left: 15px;
        padding-right: 15px;
      }

      .numero {
        font-size: 12px;
      }

      .copiar {
        min-width: 74px;
        padding: 11px 8px;
        gap: 4px;
      }

      .copiar svg {
        width: 14px;
        height: 14px;
      }
    }

  </style>
</head>

<body>

  <main class="tarjeta">

    <!-- LOGOTIPO -->

    <div class="logo">
      <img
        src="./logo.png"
        alt="Círculo Dental"
      >
    </div>

    <!-- TÍTULO -->

    <h1>Transferencia bancaria</h1>

    <!-- NÚMERO DE CUENTA -->

    <div class="campo">

      <span class="etiqueta">
        Número de cuenta
      </span>

      <div class="dato-contenedor">

        <span class="numero" id="cuenta">
          123456789012
        </span>

        <button
          class="copiar"
          type="button"
          aria-label="Copiar número de cuenta"
          onclick="copiarDato('cuenta', this)"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect
              x="8"
              y="8"
              width="12"
              height="12"
              rx="2"
            />

            <path
              d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
            />
          </svg>

          <span>Copiar</span>

        </button>

      </div>
    </div>

    <!-- SEPARADOR -->

    <div class="linea"></div>

    <!-- CLABE INTERBANCARIA -->

    <div class="campo">

      <span class="etiqueta">
        CLABE interbancaria
      </span>

      <div class="dato-contenedor">

        <span class="numero" id="clabe">
          123456789012345678
        </span>

        <button
          class="copiar"
          type="button"
          aria-label="Copiar CLABE interbancaria"
          onclick="copiarDato('clabe', this)"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect
              x="8"
              y="8"
              width="12"
              height="12"
              rx="2"
            />

            <path
              d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
            />
          </svg>

          <span>Copiar</span>

        </button>

      </div>
    </div>

  </main>

  <!-- JAVASCRIPT -->

  <script>

    async function copiarDato(id, boton) {

      const numero = document
        .getElementById(id)
        .textContent
        .replace(/\s/g, '');

      try {

        await navigator.clipboard.writeText(numero);

        const texto = boton.querySelector('span');

        texto.textContent = '¡Listo!';

        boton.classList.add('copiado');

        setTimeout(() => {

          texto.textContent = 'Copiar';

          boton.classList.remove('copiado');

        }, 1800);

      } catch (error) {

        alert(
          'No se pudo copiar el número. Puedes seleccionarlo manualmente.'
        );

      }
    }

  </script>

</body>
</html>
