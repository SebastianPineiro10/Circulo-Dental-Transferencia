
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0756b7">

  <title>Transferencia bancaria | Círculo Dental</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --azul: #0756b7;
      --azul-oscuro: #07377d;
      --naranja: #ff7900;
      --blanco: #ffffff;
      --texto: #182943;
      --borde: #e5eaf2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 14px;

      font-family: 'DM Sans', sans-serif;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255, 184, 67, 0.65),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(0, 62, 157, 0.60),
          transparent 42%
        ),
        linear-gradient(
          135deg,
          #ff8a17 0%,
          #ffb05c 34%,
          #1d72d3 72%,
          #063b88 100%
        );
    }

    /* TARJETA PRINCIPAL */

    .tarjeta {
      width: 100%;
      max-width: 480px;

      padding: 24px 22px 28px;

      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 26px;

      box-shadow:
        0 22px 60px rgba(5, 36, 83, 0.22),
        0 5px 18px rgba(5, 36, 83, 0.08);
    }

    /* LOGO */

    .logo {
      width: 190px;
      height: 115px;

      margin: 0 auto 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--blanco);
      border-radius: 18px;
      overflow: hidden;
    }

    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* TÍTULO */

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.5px;

      color: var(--azul-oscuro);
      text-align: center;

      margin-bottom: 25px;
    }

    /* CAMPOS */

    .campo {
      margin-bottom: 19px;
    }

    .campo:last-child {
      margin-bottom: 0;
    }

    .etiqueta {
      display: block;
      margin-bottom: 9px;

      color: var(--texto);
      font-size: 15px;
      font-weight: 700;
    }

    .dato-contenedor,
    .titular-contenedor {
      display: flex;
      align-items: center;

      min-height: 60px;

      padding: 10px 11px 10px 15px;

      background: #f5f8fd;
      border: 1px solid var(--borde);
      border-radius: 14px;
    }

    .dato-contenedor {
      gap: 10px;
    }

    .dato-contenedor:focus-within {
      border-color: var(--azul);
    }

    .titular-nombre {
      color: var(--azul-oscuro);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .numero {
      flex: 1;
      min-width: 0;

      color: var(--azul-oscuro);
      font-size: 17px;
      font-weight: 700;

      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;

      user-select: all;
      -webkit-user-select: all;
    }

    /* BOTONES COPIAR */

    .copiar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

      flex-shrink: 0;
      min-width: 90px;
      min-height: 44px;

      padding: 10px 12px;

      border: 0;
      border-radius: 10px;

      background: var(--azul);
      color: var(--blanco);

      font-family: inherit;
      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.2s;
    }

    .copiar:hover {
      background: var(--azul-oscuro);
    }

    .copiar:active {
      transform: scale(0.97);
    }

    .copiar.copiado {
      background: var(--naranja);
    }

    .copiar:focus-visible {
      outline: 3px solid var(--naranja);
      outline-offset: 2px;
    }

    .copiar svg {
      width: 16px;
      height: 16px;

      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* PANTALLAS DE CELULAR */

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .tarjeta {
        padding: 20px 14px 24px;
        border-radius: 22px;
      }

      .logo {
        width: 180px;
        height: 105px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 21px;
      }

      .campo {
        margin-bottom: 17px;
      }

      .etiqueta {
        font-size: 14px;
      }

      .titular-nombre {
        font-size: 16px;
      }

      .numero {
        font-size: 16px;
      }

      .dato-contenedor,
      .titular-contenedor {
        min-height: 56px;
      }
    }

    /* CELULARES ESTRECHOS */

    @media (max-width: 360px) {
      .tarjeta {
        padding-left: 12px;
        padding-right: 12px;
      }

      .dato-contenedor {
        flex-wrap: wrap;
      }

      .numero {
        font-size: 16px;
      }

      .copiar {
        min-width: 84px;
      }
    }

    /* PANTALLAS CON POCA ALTURA */

    @media (max-height: 680px) {
      .tarjeta {
        padding-top: 14px;
        padding-bottom: 18px;
      }

      .logo {
        width: 155px;
        height: 85px;
        margin-bottom: 6px;
      }

      h1 {
        margin-bottom: 15px;
      }

      .campo {
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="tarjeta">

    <!-- LOGO -->

    <div class="logo">
      <img src="./logo.png" alt="Círculo Dental">
    </div>

    <!-- TÍTULO -->

    <h1>Transferencia bancaria</h1>

    <!-- TITULAR -->

    <div class="campo">
      <span class="etiqueta">
        Titular de la cuenta
      </span>

      <div class="titular-contenedor">
        <span class="titular-nombre">
          Alejandro Fabian Piñeiro Madero
        </span>
      </div>
    </div>

    <!-- NÚMERO DE CUENTA -->

    <div class="campo">
      <span class="etiqueta">
        Número de cuenta
      </span>

      <div class="dato-contenedor">
        <span class="numero" id="cuenta">1301763115</span>

        <button
          class="copiar"
          type="button"
          aria-label="Copiar número de cuenta"
          onclick="copiarDato('cuenta', this)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="12" height="12" rx="2"/>
            <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
          </svg>
          <span>Copiar</span>
        </button>
      </div>
    </div>

    <!-- CLABE INTERBANCARIA -->

    <div class="campo">
      <span class="etiqueta">
        CLABE interbancaria
      </span>

      <div class="dato-contenedor">
        <span class="numero" id="clabe">072164013017631158</span>

        <button
          class="copiar"
          type="button"
          aria-label="Copiar CLABE interbancaria"
          onclick="copiarDato('clabe', this)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="12" height="12" rx="2"/>
            <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
          </svg>
          <span>Copiar</span>
        </button>
      </div>
    </div>

  </main>

  <script>
    async function copiarDato(id, boton) {
      const elemento = document.getElementById(id);

      if (!elemento) return;

      const numero = elemento.textContent.replace(/\s/g, '');

      if (id === 'clabe' && !/^\d{18}$/.test(numero)) {
        alert('La CLABE debe contener 18 dígitos.');
        return;
      }

      const texto = boton.querySelector('span');

      try {
        await navigator.clipboard.writeText(numero);

        texto.textContent = '¡Listo!';
        boton.classList.add('copiado');

        setTimeout(() => {
          texto.textContent = 'Copiar';
          boton.classList.remove('copiado');
        }, 1800);

      } catch (error) {
        alert('No se pudo copiar. Puedes seleccionar el número manualmente.');
      }
    }
  </script>

</body>
</html>
